<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/2311012025.css">
    <script type="module" src="js/event-form.js"></script>
    <!-- JS dosyamız buraya bağlı -->
    <title>Etkinlik Güncelle</title>
</head>

<body>

    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
        <div id="form-container">
            <p style="font-size: 0.9rem; color: #555; margin-bottom: 20px;">Alanlar mevcut etkinliğin bilgileriyle dolu gelir. Bu sprintte form veri güncellemez.</p>

            <form id="etkinlik-formu" action="#" method="POST" data-mode="guncelle" novalidate>

                <label for="ad">Etkinlik Adı *</label>
                <input type="text" id="ad" name="ad">
                <span id="ad-hata" class="hata-metni"></span>

                <label for="kategori">Kategori *</label>
                <select id="kategori" name="kategori">
                    <option value="">Seçiniz</option>
                    <option value="Seminer">Seminer</option>
                    <option value="Atölye">Atölye</option>
                    <option value="Söyleşi">Söyleşi</option>
                </select>
                <span id="kategori-hata" class="hata-metni"></span>

                <label for="tarih">Tarih *</label>
                <input type="text" id="tarih" name="tarih">
                <span id="tarih-hata" class="hata-metni"></span>

                <label for="saat">Saat *</label>
                <input type="text" id="saat" name="saat">
                <span id="saat-hata" class="hata-metni"></span>

                <label for="yer">Yer *</label>
                <input type="text" id="yer" name="yer">
                <span id="yer-hata" class="hata-metni"></span>

                <label for="kontenjan">Kontenjan</label>
                <input type="number" id="kontenjan" name="kontenjan">
                <span id="kontenjan-hata" class="hata-metni"></span>

                <label for="aciklama">Açıklama</label>
                <textarea id="aciklama" name="aciklama" rows="4"></textarea>

                <button type="submit" class="btn" style="margin-top: 25px;">Güncelle</button>

                <!-- Başarı mesajı bu kutuya gelecek -->
                <div id="form-mesaj"></div>

            </form>
        </div>
    </main>

</body>

</html>
