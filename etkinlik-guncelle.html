<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Etkinlik Güncelle</title>
</head>

<body>

    <h1>Etkinlik Güncelle</h1>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlik-ekle.html">Ekle</a>
        <a href="etkinlik-guncelle.html">Güncelle</a>
    </nav>

    <br>
    <form action="#" method="POST">

        <label for="etkinlikAdi">Etkinlik Adı</label><br>
        <input type="text" id="etkinlikAdi" name="etkinlikAdi" value="Kariyer Günleri"><br><br>

        <label for="kategori">Kategori</label><br>
        <select id="kategori" name="kategori">
            <option value="seminer" selected>Seminer</option>
            <option value="atolye">Atölye</option>
            <option value="diger">Diğer</option>
        </select><br><br>

        <label for="tarih">Tarih</label><br>
        <input type="date" id="tarih" name="tarih" value="2026-10-12"><br><br>

        <label for="aciklama">Açıklama</label><br>
        <textarea id="aciklama" name="aciklama" rows="4" cols="30">Mezun söyleşileri</textarea><br><br>

        <button type="submit">Güncelle</button>

    </form>

</body>

</html>
