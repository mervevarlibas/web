<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/2311012025.css">
    <script type="module" src="js/event-form.js"></script>
    <!-- JS dosyamız buraya bağlı -->
    <title>Etkinlik Güncelle</title>
</head>

<body>

    <header>
        <h1>Etkinlik Güncelle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <span class="nav-ayirici mobilde-var">-</span>
            <a href="etkinlikler.html">Etkinlikler</a>
            <span class="nav-ayirici mobilde-var">|</span>
            <a href="etkinlik-ekle.html">Ekle</a>
        </nav>
    </header>

    <main>
        <!-- data-mode="guncelle" eklendi. Ayrıca value="..." içindeki yazıları silebilirsiniz, artık JS dolduracak -->
        <form id="etkinlik-formu" action="#" method="POST" data-mode="guncelle" novalidate>

            <label for="ad">Etkinlik adı</label>
            <!-- value="" özelliği ile kutunun içi dolu geliyor -->
            <input type="text" id="ad" name="ad" value="Kariyer Günleri 2026">
            <span id="ad-hata" class="hata-metni" style="color:red; font-size:0.8rem; display:block;"></span>

            <label for="kategori">Kategori</label>
            <select id="kategori" name="kategori">
                <option value="">Seçiniz</option>
                <!-- selected özelliği ile bu kategori seçili geliyor -->
                <option value="Seminer" selected>Seminer</option>
                <option value="Atölye">Atölye</option>
                <option value="Söyleşi">Söyleşi</option>
            </select>
            <span id="kategori-hata" class="hata-metni" style="color:red; font-size:0.8rem; display:block;"></span>

            <label for="tarih">Tarih</label>
            <input type="text" id="tarih" name="tarih" value="12-10-2026">
            <span id="tarih-hata" class="hata-metni" style="color:red; font-size:0.8rem; display:block;"></span>

            <label for="saat">Saat</label>
            <input type="text" id="saat" name="saat" value="14:00">
            <span id="saat-hata" class="hata-metni" style="color:red; font-size:0.8rem; display:block;"></span>

            <label for="yer">Yer</label>
            <input type="text" id="yer" name="yer" value="A Blok Konferans Salonu">
            <span id="yer-hata" class="hata-metni" style="color:red; font-size:0.8rem; display:block;"></span>

            <label for="aciklama">Açıklama</label>
            <input type="text" id="aciklama" name="aciklama" value="Mezunlarla söyleşiler ve şirket standları.">

            <label for="kontenjan">Kontenjan</label>
            <input type="number" id="kontenjan" name="kontenjan" value="120">
            <span id="kontenjan-hata" class="hata-metni" style="color:red; font-size:0.8rem; display:block;"></span>

            <!-- Butonun adı Güncelle -->
            <button type="submit">Güncelle</button>

            <!-- Başarı mesajı için bölüm -->
            <div id="form-mesaj" style="margin-top: 15px; background-color: #dcedc8; padding: 10px; border-radius: 5px; display: none;"></div>

        </form>
    </main>

</body>

</html>
